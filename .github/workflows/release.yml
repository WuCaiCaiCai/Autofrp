name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.5)"
        required: true
        default: "v1.1.5"

permissions:
  contents: write

# 同一个标签重复触发时，取消上一次未完成的发布
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22.x"

jobs:
  release:
    name: Build static binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ "$TAG" != v* ]]; then
            echo "::error::标签必须以 v 开头（如 v1.0.0），当前为: $TAG"
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Verify version consistency
        run: |
          APP_VER="$(sed -n 's/.*AppVersion = "\(.*\)"/\1/p' internal/config/types.go)"
          SH_VER="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' autof.sh)"
          echo "tag=$VERSION  AppVersion=$APP_VER  autof.sh=$SH_VER"
          if [ "$APP_VER" != "$VERSION" ] || [ "$SH_VER" != "$VERSION" ]; then
            echo "::error::版本号不一致：tag=$VERSION / AppVersion=$APP_VER / autof.sh=$SH_VER。请同步修改后再打标签。"
            exit 1
          fi

      - name: Test before release
        run: |
          bash -n autof.sh
          go vet ./...
          go test ./...

      - name: Build binaries (amd64 / arm64)
        run: |
          set -euo pipefail
          mkdir -p dist
          for ARCH in amd64 arm64; do
            echo "==> Building autof_linux_${ARCH} (v${VERSION})"
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" \
              go build -trimpath -ldflags="-s -w" -o "dist/autof_linux_${ARCH}" ./cmd/autof
          done
          cd dist
          sha256sum autof_linux_amd64 autof_linux_arm64 > checksums.txt
          echo "--- 产物清单 ---"
          ls -lh

      - name: Verify binaries
        run: |
          set -euo pipefail
          file dist/autof_linux_amd64 dist/autof_linux_arm64
          # amd64 可直接执行验证版本与核心命令
          chmod +x dist/autof_linux_amd64
          AUTOF_STATE_DIR="$(mktemp -d)" ./dist/autof_linux_amd64 version
          AUTOF_STATE_DIR="$(mktemp -d)" ./dist/autof_linux_amd64 help > /dev/null

      - name: Prune stale assets from existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "清理 $RELEASE_TAG 中的旧产物，避免历史文件名残留"
            gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' | while read -r name; do
              [ -n "$name" ] || continue
              gh release delete-asset "$RELEASE_TAG" "$name" -y >/dev/null 2>&1 || true
            done
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Autofrp ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/autof_linux_amd64
            dist/autof_linux_arm64
            dist/checksums.txt
