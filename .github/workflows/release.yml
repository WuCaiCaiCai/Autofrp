name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  GO_VERSION: "1.22.x"
  NFPM_VERSION: "v2.48.0"

jobs:
  release:
    name: Build deb / rpm / apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ "$TAG" != v* ]]; then
            echo "::error::标签必须以 v 开头（如 v1.0.0），当前为: $TAG"
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Test before release
        run: |
          bash -n autof.sh
          go vet ./...
          go test ./...

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${{ env.NFPM_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/nfpm" --version

      - name: Build binaries and packages (amd64 / arm64)
        run: |
          set -euo pipefail
          mkdir -p dist
          for ARCH in amd64 arm64; do
            echo "==> Building autof_linux_${ARCH} (v${VERSION})"
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" \
              go build -trimpath -ldflags="-s -w" -o "dist/autof_linux_${ARCH}" ./cmd/autof

            cp "dist/autof_linux_${ARCH}" "dist/autof"
            for FORMAT in deb rpm apk; do
              NFPM_ARCH="$ARCH" NFPM_VERSION="$VERSION" \
                nfpm package -f nfpm.yaml -p "$FORMAT" \
                -t "dist/autof_${VERSION}_linux_${ARCH}.${FORMAT}"
            done
            rm -f "dist/autof"
          done

          cd dist
          sha256sum autof_linux_amd64 autof_linux_arm64 *.deb *.rpm *.apk > checksums.txt
          echo "--- 产物清单 ---"
          ls -lh

      - name: Verify package metadata
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm
          for f in dist/*.deb; do echo "== $f"; dpkg-deb -I "$f" | grep -E "Package:|Version:|Architecture:"; done
          for f in dist/*.rpm; do echo "== $f"; rpm -qip "$f" | grep -E "Name|Version|Architecture"; done
          for f in dist/*.apk; do echo "== $f"; tar -xzOf "$f" .PKGINFO | grep -E "pkgname|pkgver|arch"; done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Autofrp ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/autof_linux_amd64
            dist/autof_linux_arm64
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt
