name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build Multi-Arch Binaries & Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Run tests before release
        run: |
          bash -n autof.sh
          go test -v ./...

      - name: Install rpmbuild for Fedora/RHEL package generation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Build static binaries and packages (Debian/Deepin .deb, Fedora .rpm, Arch PKGBUILD)
        run: |
          RAW_TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          if [[ "$RAW_TAG" != v* ]]; then
            RAW_TAG="v1.0.0"
          fi
          VER="${RAW_TAG#v}"
          mkdir -p dist

          ARCHS=("amd64" "arm64" "arm" "386" "riscv64" "loong64")
          for ARCH in "${ARCHS[@]}"; do
            GOARM_VAL=""
            [ "$ARCH" = "arm" ] && GOARM_VAL="7"

            BIN_NAME="autof_linux_${ARCH}"
            echo "==> Building ${BIN_NAME} (v${VER})..."
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" GOARM="$GOARM_VAL" \
              go build -trimpath -ldflags="-s -w" -o "dist/${BIN_NAME}" ./cmd/autof

            # 打包通用 tar.gz
            STAGE_DIR="dist/stage_${ARCH}"
            mkdir -p "$STAGE_DIR"
            cp "dist/${BIN_NAME}" "${STAGE_DIR}/autof"
            cp autof.sh README.md LICENSE "$STAGE_DIR/"
            tar -czf "dist/autof_${VER}_linux_${ARCH}.tar.gz" -C "$STAGE_DIR" autof autof.sh README.md LICENSE
            rm -rf "$STAGE_DIR"

            # 构建 Debian / Ubuntu / Deepin / UOS 原生 .deb 安装包 (amd64 / arm64 / armhf / loong64)
            DEB_ARCH=""
            case "$ARCH" in
              amd64) DEB_ARCH="amd64" ;;
              arm64) DEB_ARCH="arm64" ;;
              arm)   DEB_ARCH="armhf" ;;
              386)   DEB_ARCH="i386" ;;
              riscv64) DEB_ARCH="riscv64" ;;
              loong64) DEB_ARCH="loong64" ;;
            esac
            if [ -n "$DEB_ARCH" ]; then
              DEB_ROOT="dist/deb_${DEB_ARCH}"
              mkdir -p "${DEB_ROOT}/DEBIAN" "${DEB_ROOT}/usr/local/bin"
              install -m 0755 "dist/${BIN_NAME}" "${DEB_ROOT}/usr/local/bin/autof"
              cat > "${DEB_ROOT}/DEBIAN/control" <<EOF
          Package: autof
          Version: ${VER}
          Section: net
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: Wu Cai <https://github.com/WuCaiCaiCai/Autofrp>
          Description: Autofrp - FRP (frps/frpc) & Caddy reverse proxy controller with WebUI
           Supports Debian, Ubuntu, Deepin, UOS and derivative distributions.
          EOF
              dpkg-deb --build --root-owner-group "${DEB_ROOT}" "dist/autof_${VER}_linux_${DEB_ARCH}.deb"
              rm -rf "${DEB_ROOT}"
            fi

            # 构建 Fedora / RHEL / Rocky / AlmaLinux 原生 .rpm 安装包 (x86_64 / aarch64)
            RPM_ARCH=""
            case "$ARCH" in
              amd64) RPM_ARCH="x86_64" ;;
              arm64) RPM_ARCH="aarch64" ;;
            esac
            if [ -n "$RPM_ARCH" ] && command -v rpmbuild >/dev/null 2>&1; then
              RPM_TOP="$(pwd)/dist/rpm_${RPM_ARCH}"
              mkdir -p "${RPM_TOP}"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
              cp "dist/${BIN_NAME}" "${RPM_TOP}/SOURCES/autof"
              cat > "${RPM_TOP}/SPECS/autof.spec" <<EOF
          Name:           autof
          Version:        ${VER}
          Release:        1
          Summary:        Autofrp - FRP (frps/frpc) and Caddy reverse proxy controller with WebUI
          License:        MIT
          URL:            https://github.com/WuCaiCaiCai/Autofrp
          BuildArch:      ${RPM_ARCH}
          %define _build_id_links none

          %description
          Unified FRP (frps/frpc) and Caddy reverse proxy management tool with embedded WebUI.

          %install
          mkdir -p %{buildroot}/usr/local/bin
          install -m 0755 %{_sourcedir}/autof %{buildroot}/usr/local/bin/autof

          %files
          /usr/local/bin/autof
          EOF
              rpmbuild --define "_topdir ${RPM_TOP}" --target "${RPM_ARCH}" -bb "${RPM_TOP}/SPECS/autof.spec"
              find "${RPM_TOP}/RPMS" -name "*.rpm" -exec mv {} dist/ \;
              rm -rf "${RPM_TOP}"
            fi
          done

          # 生成 Arch Linux / Manjaro 的 PKGBUILD
          cat > dist/PKGBUILD <<EOF
          # Maintainer: Wu Cai <https://github.com/WuCaiCaiCai/Autofrp>
          pkgname=autof-bin
          pkgver=${VER}
          pkgrel=1
          pkgdesc="FRP (frps/frpc) & Caddy reverse proxy controller with embedded WebUI"
          arch=('x86_64' 'aarch64' 'armv7h' 'riscv64' 'loong64')
          url="https://github.com/WuCaiCaiCai/Autofrp"
          license=('MIT')
          provides=('autof')
          conflicts=('autof')
          source_x86_64=("autof_${VER}_linux_amd64::https://github.com/WuCaiCaiCai/Autofrp/releases/download/v${VER}/autof_linux_amd64")
          source_aarch64=("autof_${VER}_linux_arm64::https://github.com/WuCaiCaiCai/Autofrp/releases/download/v${VER}/autof_linux_arm64")
          sha256sums_x86_64=('SKIP')
          sha256sums_aarch64=('SKIP')

          package() {
            install -Dm755 "\${srcdir}/autof_${VER}_linux_"* "\${pkgdir}/usr/local/bin/autof"
          }
          EOF

          cp autof.sh dist/autof.sh
          (cd dist && sha256sum autof_linux_* *.tar.gz *.deb *.rpm autof.sh > checksums.txt)
          ls -lh dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/autof_linux_*
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/PKGBUILD
            dist/autof.sh
            dist/checksums.txt
