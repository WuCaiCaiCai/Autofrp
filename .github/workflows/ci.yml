name: CI

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Check bash syntax (autof.sh)
        run: bash -n autof.sh

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -race ./...

      - name: Cross-compile amd64 & arm64
        run: |
          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" \
              go build -trimpath -ldflags="-s -w" -o "dist/autof_linux_${ARCH}" ./cmd/autof
          done
          ls -lh dist/

      - name: Upload amd64 binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: autof-linux-amd64
          path: dist/autof_linux_amd64

  distro-smoke-test:
    name: Distro Compatibility (${{ matrix.distro }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:bookworm-slim
          - distro: fedora
            image: fedora:latest
          - distro: alpine
            image: alpine:latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled binary
        uses: actions/download-artifact@v4
        with:
          name: autof-linux-amd64
          path: dist

      - name: Smoke test on ${{ matrix.distro }}
        run: |
          chmod +x dist/autof_linux_amd64
          install -m 0755 dist/autof_linux_amd64 /usr/local/bin/autof
          export AUTOF_STATE_DIR="/tmp/autof_ci_test"
          autof version
          autof status
          autof detect
          autof gen frps > /dev/null
          autof gen caddy > /dev/null
          autof help > /dev/null
