# nfpm 打包配置：一次定义，产出 deb / rpm / apk 三种格式
# 构建时通过环境变量注入：NFPM_ARCH (amd64|arm64)、NFPM_VERSION (1.0.0)、NFPM_BIN
name: autof
arch: ${NFPM_ARCH}
platform: linux
version: ${NFPM_VERSION}
version_schema: semver
release: "1"
section: net
priority: optional
maintainer: Wu Cai (WuCaiCaiCai) <https://github.com/WuCaiCaiCai/Autofrp>
vendor: Autofrp
homepage: https://github.com/WuCaiCaiCai/Autofrp
license: MIT
provides:
  - autof
description: |
  Autofrp - 内网穿透 (frps/frpc) 与 Caddy 快速反代一体化管理工具（内置 WebUI）。

  支持远程 VPS 与本地服务器双端独立部署、一键连接码导入导出、
  Caddy 域名自动 HTTPS / 局域网自签证书 / DNS API 泛域名证书，
  以及自动识别并吞并迁移服务器上原有的 NPM / Nginx / 原版 Caddy / frp。

contents:
  # 打包前请先把目标架构二进制复制为 dist/autof
  - src: ./dist/autof
    dst: /usr/local/bin/autof
    file_info:
      mode: 0755
